name: CI

# Validates the repository's own infrastructure. Compliance of the individual
# runfiles libraries is reported by the `Test <language>` workflows instead.
on:
  push:
    branches:
      - main
  merge_group:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  # The reference subject implements the specification the scenarios encode,
  # so the harness, launchers, and scenarios are exercised end to end without
  # depending on any ruleset's library.
  harness:
    name: Harness
    uses: ./.github/workflows/test-lang.yaml
    with:
      targets: //test/reference/...

  # Every target, including all language integrations, must at least build.
  build:
    name: Build (Bazel ${{ matrix.bazel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bazel: [7.x, 8.x, 9.x]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@v5
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Setup Bazelrc
        run: |
          echo "common --keep_going" >> ./user.bazelrc

      - name: Build
        run: bazel --bazelrc=${{ github.workspace }}/.github/github.bazelrc build //... --config=all
