name: Test Julia

# Compliance status for the Julia runfiles library. Red means at least one
# conformance scenario fails for the version pinned in MODULE.bazel; see the
# tables in README.md. Not a pull request gate: CI validates the harness itself.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-julia:
    name: Julia
    uses: ./.github/workflows/test-lang.yaml
    with:
      targets: //test/julia:test_runfiles
      flags: --config=julia
