name: Test Shell

# Compliance status for the Shell runfiles library. Red means at least one
# conformance scenario fails for the version pinned in MODULE.bazel; see the
# tables in README.md. Not a pull request gate: CI validates the harness itself.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-shell:
    name: Shell
    uses: ./.github/workflows/test-lang.yaml
    with:
      targets: //test/shell:test_runfiles
      flags: --config=shell
