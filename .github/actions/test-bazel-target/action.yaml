name: Test Bazel Target
description: Tests a Bazel target across platforms

inputs:
  target:
    description: 'Bazel test target to run'
    required: true
  flags:
    description: 'Extra flags for `bazel test` (e.g. `--config=rust`)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: bazel-contrib/setup-bazel@0.19.1
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true

    - name: Setup Bazelrc (Windows)
      shell: bash
      run: |
        echo "TEMP=${{ runner.temp }}" >> "$GITHUB_ENV"
        echo "TMP=${{ runner.temp }}" >> "$GITHUB_ENV"
        echo "startup --output_user_root=D:/bzl" > ./user.bazelrc
      if: runner.os == 'Windows'

    - name: Setup Bazelrc
      shell: bash
      run: |
        echo "common --keep_going" >> ./user.bazelrc

    - name: Test (Unix)
      shell: bash
      run: bazel --bazelrc=${{ github.workspace }}/.github/github.bazelrc test ${{ inputs.target }} ${{ inputs.flags }}
      if: runner.os != 'Windows'

    - name: Test (Windows)
      shell: pwsh
      run: bazel --bazelrc=${{ github.workspace }}/.github/github.bazelrc test ${{ inputs.target }} ${{ inputs.flags }}
      if: runner.os == 'Windows'

